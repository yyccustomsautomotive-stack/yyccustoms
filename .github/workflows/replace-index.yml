name: Replace index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp yyc-customs-automotive-website.html index.html
      - run: |
          git config user.name yyccustomsautomotive-stack
          git config user.email yyccustomsautomotive@gmail.com
          git add index.html
          git commit -m "Replace index.html with updated website" || echo "No changes"
          git push
